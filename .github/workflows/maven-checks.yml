name: Maven checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Check Docker engine
        run: docker version

      - name: Build JARs on Ubuntu and RPM in ALT p11
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests -Drpm.buildMode=container

      - name: Upload verified RPM
        uses: actions/upload-artifact@v7
        with:
          name: demo-rpm
          path: demo/target/rpm-work/RPMS/noarch/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Upload RPM build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpm-build-logs
          path: |
            demo/target/rpm-work/*.log
            demo/target/rpm-work/SPECS/*.spec
            demo/target/rpm-work/environment.txt
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Check Java source and test code
        run: mvn --batch-mode --no-transfer-progress checkstyle:check
